<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Clinic{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header>
      <h1>Клініка</h1>
      <nav>
        <a href="{{ url_for('index') }}">Головна</a>
        <a href="{{ url_for('patients') }}">Пацієнти</a>
        <a href="{{ url_for('doctors') }}">Лікарі</a>
        <a href="{{ url_for('appointments') }}">Записи</a>
        <a href="{{ url_for('add_patient') }}">Додати пацієнта</a>
      </nav>
      <hr />
    </header>

    <main>{% block content %} {% endblock %}</main>

    <footer>
      <hr />
      <p>© 2026 Clinic</p>
    </footer>
  </body>
</html>
